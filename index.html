    <style>
        @keyframes pulse-shake {
            0%, 90%, 100% { transform: translateX(0); }
            92% { transform: translateX(-4px) rotate(-1deg); }
            94% { transform: translateX(4px) rotate(1deg); }
            96% { transform: translateX(-4px) rotate(-1deg); }
            98% { transform: translateX(4px) rotate(1deg); }
        }
        .shake-button { animation: pulse-shake 5s infinite; }
        
        .bg-video {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            object-fit: cover;
            filter: blur(25px) brightness(0.3);
            pointer-events: none;
        }

        .card-bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            object-fit: cover;
            filter: brightness(0.7);
            pointer-events: none;
        }
    </style>
